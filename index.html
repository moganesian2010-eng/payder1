.empty-state,
.loading-state,
.error-state {
  background: #ffffffd1;
  border: 1px solid #e0e1da;
  border-radius: 22px;
  max-width: 484px;
  margin: 40px auto 0;
  padding: 36px 28px;
  text-align: center;
}

.empty-state h2,
.loading-state h2,
.error-state h2 {
  margin: 0 0 8px;
  font-size: 22px;
  letter-spacing: -0.6px;
}

.empty-state p,
.loading-state p,
.error-state p {
  color: #969a90;
  margin: 0 0 18px;
  font-size: 13px;
}

.field-error {
  color: #a33e3e;
  margin-top: 6px;
  font-size: 10px;
  font-weight: 700;
}

.admin-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

.admin-table {
  width: 100%;
  border-collapse: collapse;
  background: #ffffffd1;
  border: 1px solid #e0e1da;
  border-radius: 18px;
  overflow: hidden;
}

.admin-table th,
.admin-table td {
  text-align: left;
  border-bottom: 1px solid #ecece7;
  padding: 12px 14px;
  font-size: 12px;
}

.admin-table th {
  color: #777b71;
  font-size: 10px;
  font-weight: 800;
}

.admin-login {
  max-width: 380px;
  margin: 12vh auto;
  padding: 28px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

.sidebar-card {
  cursor: pointer;
  text-align: left;
  width: 100%;
}

.sidebar-card:hover {
  border-color: #cfd1c8;
}

.admin-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 8px;
}

.admin-table td .purpose-cell {
  max-width: 420px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.admin-empty {
  color: #969a90;
  padding: 18px 14px;
  font-size: 13px;
}

.badge-on,
.badge-off {
  display: inline-flex;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 800;
}

.badge-on {
  color: #3d6418;
  background: #e7f8c5;
}

.badge-off {
  color: #6b6458;
  background: #f0ece4;
}

@media (width <= 700px) {
  .admin-table {
    display: block;
    overflow-x: auto;
  }
}

/* Account access */
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:28px;background:#f4f4ef}
.auth-panel{width:min(100%,460px);padding:42px;background:#fff;border:1px solid #e8e8e1;border-radius:24px;box-shadow:0 18px 60px rgba(30,35,25,.07)}
.auth-panel .logo{margin-bottom:38px}
.auth-panel h1{font-size:34px;letter-spacing:-1.2px;margin:12px 0}
.auth-description{color:#77796f;line-height:1.6;margin-bottom:26px}
.auth-form{display:grid;gap:18px}
.auth-form label{display:grid;gap:8px;font-weight:600;font-size:14px}
.auth-form input{width:100%;padding:14px 15px;border:1px solid #dedfd6;border-radius:12px;background:#fbfbf8;font:inherit;outline:none}
.auth-form input:focus{border-color:#7c9c54;box-shadow:0 0 0 3px rgba(124,156,84,.13)}
.auth-switch{width:100%;margin-top:18px}
.sidebar-logout{display:block;margin:12px auto 0}
@media(max-width:600px){.auth-panel{padding:28px 22px}.auth-panel h1{font-size:29px}}

/* Документы: стартовый экран и читалка */
.gate-panel{width:min(100%,480px)}
.gate-head{text-align:center;margin-bottom:28px}
.gate-head .logo{justify-content:center;margin:0 0 12px!important}
.gate-panel h1{text-align:center;font-size:30px!important;margin:18px 0 8px!important}
.gate-panel .auth-description{text-align:center;margin-bottom:22px}
.gate-docs{display:grid;gap:10px}
.gate-doc{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;width:100%;padding:13px 16px 13px 14px;text-align:left;background:#fbfbf8;border:1px solid #e8e8e1;border-radius:16px;transition:border-color .16s,background .16s,transform .16s}
.gate-doc:hover{background:#fff;border-color:#cfd1c8}
.gate-doc:active{transform:scale(.99)}
.gate-doc-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#eef9d3;color:#3d6418}
.gate-doc-title{font-size:14px;font-weight:700;line-height:1.35}
.gate-doc-arrow{color:#9a9e95;display:grid}
.docs-panel-list{margin-top:12px}
.gate-note{margin:16px 2px 18px;color:#969a90;font-size:12px;line-height:1.55}
.gate-checks{display:grid;padding:4px 16px;background:#fbfbf8;border:1px solid #e8e8e1;border-radius:16px}
.gate-check{position:relative;display:flex;align-items:flex-start;gap:12px;margin:0;padding:13px 0;color:#1d211b;font-size:13.5px;font-weight:600;line-height:1.45;cursor:pointer}
.gate-check+.gate-check{border-top:1px solid #ecece7}
.gate-check input{position:absolute;opacity:0;width:22px;height:22px;margin:0;cursor:pointer}
.gate-box{flex:none;display:grid;place-items:center;width:22px;height:22px;margin-top:1px;color:transparent;background:#fff;border:1.5px solid #c9cbc1;border-radius:7px;transition:background .16s,border-color .16s,color .16s}
.gate-check input:checked+.gate-box{color:#20241d;background:#c7f36b;border-color:#a7d44a}
.gate-check input:focus-visible+.gate-box{outline:3px solid #77993147;outline-offset:2px}
.gate-panel .gate-continue{margin-top:18px;padding:15px 18px;font-size:13px}
.gate-panel .field-error{margin-top:12px;font-size:12px}
.gate-hint{margin-top:14px;text-align:center;color:#969a90;font-size:12px}
.gate-hint[hidden]{display:none}
.legal-links{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px;margin-top:20px;padding-top:18px;border-top:1px solid #ecece7}
.legal-links .text-button{font-size:11px;padding:6px 6px}
.legal-links .text-button:hover{color:#1d211b;text-decoration:underline}

.legal-overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:#191c1780;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:.18s fade-in}
.legal-sheet{display:flex;flex-direction:column;width:min(100%,720px);max-height:min(90vh,860px);overflow:hidden;background:#fff;border-radius:26px;box-shadow:0 30px 90px #12141047;animation:.26s cubic-bezier(.2,.8,.2,1) modal-in}
.legal-head{display:flex;align-items:flex-start;gap:14px;padding:22px 28px 18px;border-bottom:1px solid #ecece7}
.legal-back{flex:none;display:grid;place-items:center;width:38px;height:38px;margin-top:2px;color:#70746b;background:#f2f3ee;border:0;border-radius:50%;transition:background .16s}
.legal-back:hover{background:#e8e9e2}
.legal-head h2{margin:6px 0 0;font-size:22px;line-height:1.2;letter-spacing:-.6px}
.legal-version{display:inline-block;margin-top:9px;padding:3px 9px;color:#3d6418;background:#eef9d3;border-radius:999px;font-size:10px;font-weight:800}
.legal-scroll{flex:1;overflow-y:auto;padding:6px 28px 14px;overscroll-behavior:contain}
.legal-section{padding-top:20px}
.legal-section h3{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:15px;font-weight:800;letter-spacing:-.2px}
.legal-sec-num{color:#7c9c54;font-variant-numeric:tabular-nums}
.legal-clause{display:grid;grid-template-columns:38px 1fr;gap:6px;margin:0 0 9px;color:#40443b;font-size:13px;line-height:1.65}
.legal-num{color:#a0a499;font-weight:700;font-variant-numeric:tabular-nums}
.legal-lead{margin:0 0 9px;padding-left:44px;color:#40443b;font-size:13px;line-height:1.65}
.legal-note{color:#6f7367;font-style:normal}
.legal-label{margin:12px 0 7px 44px;font-size:12px;font-weight:800;letter-spacing:.2px;color:#1d211b}
.legal-list{display:grid;gap:5px;margin:0 0 12px 44px;padding:0;list-style:none}
.legal-list li{position:relative;padding-left:17px;color:#40443b;font-size:13px;line-height:1.55}
.legal-list li::before{content:"";position:absolute;left:1px;top:.62em;width:6px;height:6px;background:#c7f36b;border:1px solid #a7d44a;border-radius:50%}
.legal-foot{padding:16px 28px 22px;border-top:1px solid #ecece7}
.legal-foot .primary-button{padding:14px 18px;font-size:13px}
@media(max-width:600px){
  .gate-panel h1{font-size:26px!important}
  .legal-overlay{align-items:end;padding:0}
  .legal-sheet{width:100%;max-height:93vh;border-radius:24px 24px 0 0}
  .legal-head{padding:18px 20px 14px}
  .legal-head h2{font-size:19px}
  .legal-scroll{padding:4px 20px 12px}
  .legal-foot{padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px))}
  .legal-clause{grid-template-columns:32px 1fr}
  .legal-lead,.legal-label,.legal-list{margin-left:0;padding-left:0}
  .legal-lead,.legal-label{padding-left:38px}
  .legal-list{margin-left:38px}
}

/* Секции профиля на общем фоне. */
.profile-screen .profile-summary {
  padding-inline: 0;
}

.profile-sections {
  min-width: 0;
  border-top: 1px solid #dedfd8;
}

.profile-section {
  border-bottom: 1px solid #dedfd8;
}

.profile-section-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 52px;
  padding: 12px 4px;
  text-align: left;
  font-size: 15px;
  font-weight: 800;
}

.profile-section-button svg {
  color: #60665c;
}

.profile-section-button[aria-expanded="true"] svg {
  transform: rotate(90deg);
}

.profile-section-content {
  padding: 0 4px 16px;
}

.profile-screen .details-panel {
  padding: 4px 0 0;
}

.profile-screen .privacy-panel {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
}

.profile-screen .docs-panel-list .gate-doc {
  padding-inline: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.profile-screen .docs-panel-list .gate-doc:hover .gate-doc-title {
  text-decoration: underline;
}

.profile-screen .docs-panel-list {
  margin-top: 0;
}

.mobile-logout {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 1px solid #a33e3e;
  border-radius: 50%;
  color: #fff;
  background: #a33e3e;
}

.request-card .amount-label,
.request-card .amount {
  display: block;
  text-align: center;
}

.request-card .amount {
  margin-bottom: 18px;
}

.request-card .card-top {
  justify-content: center;
}

.request-card {
  background: var(--card-color, #d9f99d);
}

.request-card .category {
  padding: 8px 16px;
  font-size: 14px;
  letter-spacing: 0;
}

.card-description-button {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  margin-top: 8px;
  padding: 6px 12px;
  border: 1px solid #23271f40;
  border-radius: 999px;
  color: #20241d;
  background: #ffffff60;
  font-size: 12px;
  font-weight: 800;
}

.card-description-button[hidden] {
  display: none;
}

.card-description {
  touch-action: auto;
  cursor: auto;
  width: min(calc(100% - 32px), 420px);
  max-height: calc(100dvh - 32px);
  margin: auto;
  padding: 24px;
  overflow: auto;
  border-radius: 22px;
  color: var(--text, #20241d);
  background: var(--surface, #fafaf7);
  user-select: text;
}

.card-description::backdrop {
  background: #191c1780;
}

.card-description h2 {
  font-size: 20px;
  font-weight: 800;
}

.card-description p {
  margin: 12px 0 20px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.5;
}

.swipe-actions {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.swipe-action {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 8px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
}

.swipe-action.skip-action {
  color: #fff;
  background: #a33e3e;
}

.swipe-action:active {
  filter: brightness(0.92);
}

.stats-screen > .chart-panel {
  margin-bottom: 16px;
}

.create-heading {
  justify-content: center;
  text-align: center;
}

.stats-periods {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  border: 1px solid #dedfd8;
  border-radius: 999px;
  background: #fafaf7;
}

.stats-periods button {
  min-width: 44px;
  min-height: 44px;
  border-radius: 999px;
  color: #60665c;
  font-size: 13px;
  font-weight: 800;
}

.stats-periods button[aria-pressed="true"] {
  color: #252921;
  background: #d9f99d;
}

.stats-periods button:focus-visible {
  outline-offset: -3px;
}

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --mobile-chrome: var(--surface, #fafaf7);
}

html {
  touch-action: pan-x pan-y;
}

:is(.app-shell, .main, .auth-shell) {
  min-height: 100dvh;
}

@media (width <= 700px), (pointer: coarse) and (height <= 500px) {
  html {
    scroll-padding-block: calc(76px + var(--safe-top)) calc(96px + var(--safe-bottom));
  }

  .mobile-header {
    display: flex;
    position: fixed;
    z-index: 30;
    inset: 0 0 auto;
    align-items: center;
    justify-content: space-between;
    height: calc(66px + var(--safe-top));
    padding: var(--safe-top) max(18px, var(--safe-right)) 0 max(18px, var(--safe-left));
    border: 0;
    background: var(--mobile-chrome);
  }

  .sidebar {
    display: none;
  }

  .main {
    margin: 0;
  }

  .screen {
    padding-top: calc(91px + var(--safe-top));
    padding-inline: max(18px, var(--safe-left)) max(18px, var(--safe-right));
  }

  .feed-screen {
    display: block;
    padding-top: calc(89px + var(--safe-top));
  }

  .auth-shell {
    padding-top: max(28px, var(--safe-top));
    padding-bottom: max(28px, var(--safe-bottom));
  }

  :is(.details-panel, .create-form, .auth-form) :is(input:not([type="file"]), textarea, select) {
    font-size: 16px;
  }

  .amount-input input {
    font-size: 20px;
  }

  .mobile-header .stats-periods {
    margin-inline: auto;
  }

  .stats-screen .screen-heading .stats-periods {

const FALLBACK_COLORS = {
  Образование: "#BFDBFE",
  Техника: "#D9F99D",
  Здоровье: "#FDE68A",
  "Доброе дело": "#FBCFE8",
  Творчество: "#FED7AA",
  Другое: "#E7E5E4",
};

function cardColor(category, colors = {}) {
  return colors[category] || FALLBACK_COLORS[category] || "#D9F99D";
}

function shortName(name) {
  const parts = String(name || "").split(" ").filter(Boolean);
  if (parts.length < 2) return name || "Алексей М.";
  return `${parts[0]} ${parts[1][0]}.`;
}

function renderCardDescription(description = "") {
  return `
    <button type="button" class="card-description-button" data-open-description aria-haspopup="dialog"${description.trim() ? "" : " hidden"}>Расширенное описание</button>
    <dialog class="card-description" aria-label="Расширенное описание">
      <h2>Расширенное описание</h2>
      <p data-card-description>${escapeHtml(description)}</p>
      <button type="button" class="primary-button" data-close-description>Закрыть</button>
    </dialog>`;
}

// SOURCE: components/feed.js

function renderFeed({ cards, index, dragX, dragging, animating, error, loading }) {
  if (loading) {
    return `
      <section class="screen feed-screen">
        <div class="screen-heading feed-heading">
          <h1>Кому поможем сегодня?</h1>
        </div>
        <div class="loading-state"><h2>Загружаем карточки</h2><p>Ещё секунда</p></div>
      </section>`;
  }

  if (error) {
    return `
      <section class="screen feed-screen">
        <div class="screen-heading feed-heading">
          <h1>Кому поможем сегодня?</h1>
        </div>
        <div class="error-state">
          <h2>Не получилось загрузить ленту</h2>
          <p>${escapeHtml(error)}</p>
          <button class="primary-button" data-action="reload">Попробовать снова</button>
        </div>
      </section>`;
  }

  if (!cards.length) {
    return `
      <section class="screen feed-screen">
        <div class="screen-heading feed-heading">
          <h1>Кому поможем сегодня?</h1>
        </div>
        <div class="empty-state">
          <h2>Пока нет запросов</h2>
          <p>Создайте первую карточку или загляните позже</p>
          <button class="primary-button" data-nav="create">Создать карточку</button>
        </div>
      </section>`;
  }

  const current = cards[index % cards.length];
  const next = cards[(index + 1) % cards.length];
  const progress = (index % cards.length) + 1;
  const rotate = Math.max(-12, Math.min(12, dragX / 28));
  const stamp = dragX > 40 ? "ПОМОЧЬ" : dragX < -40 ? "ДАЛЬШЕ" : "";

  return `
    <section class="screen feed-screen">
      <div class="screen-heading feed-heading">
        <h1>Кому поможем сегодня?</h1>
        <div class="counter"><span>${progress}</span> / ${cards.length}</div>
      </div>
      <div class="deck-wrap">
        <div class="request-card card-behind second" style="--card-color:${escapeHtml(next.color)}"></div>
        <div class="request-card card-behind first" style="--card-color:${escapeHtml(next.color)}"></div>
        <div
          class="request-card active-card ${dragging ? "dragging" : ""} ${animating ? "animating" : ""}"
          style="--card-color:${escapeHtml(current.color)};transform:translateX(${dragX}px) rotate(${rotate}deg)"
          data-card
        >
          ${stamp ? `<div class="swipe-stamp ${dragX > 0 ? "help" : "skip"}">${stamp}</div>` : ""}
          <div class="card-top">
            <span class="category">${escapeHtml(current.category)}</span>
          </div>
          <div class="card-content">
            <span class="amount-label">НУЖНА СУММА</span>
            <div class="amount">${money(current.amount)}</div>
            <p class="purpose">${escapeHtml(current.purpose)}</p>
            ${current.description?.trim() ? renderCardDescription(current.description) : ""}
          </div>
          <div class="card-author">
            <span class="author-avatar">${escapeHtml(current.initials)}</span>
            <div>
              <span>Автор запроса</span>
              <strong>${escapeHtml(current.author)}</strong>
            </div>
          </div>
        </div>
      </div>
      <div class="swipe-actions">
        <button type="button" class="swipe-action skip-action" data-swipe="left">
          ${icon("close", 20)} Пропустить
        </button>
        <button type="button" class="swipe-action help-action" data-swipe="right">
          ${icon("heart", 20)} Помочь
        </button>
      </div>
      <p class="desktop-hint">Перетяните карточку или используйте кнопки</p>
    </section>`;
}

function renderStats({ stats, period = "month", loading = false, error = "" }) {
  if (loading && !stats) {

  }

  if (error && !stats) {

  if (!stats) {

  }

  const max = Math.max(...stats.chart.map((item) => item.value), 1);

  return `
    <section class="screen content-screen stats-screen">

        <div>
          <p class="eyebrow">ВАША АКТИВНОСТЬ</p>

            .map(

            )
            .join("")}
        </div>
      </div>
      <div class="metrics-grid">
        <div class="metric-card accent">
          <span>Собрано на ваши карточки</span>
          <strong>${money(stats.collected)}</strong>
          <small>${escapeHtml(stats.collected_delta || "За выбранный период")}</small>

    </section>`;
}


// SOURCE: components/legal.js


const ORDER = ["privacy", "terms"];

function renderBlocks(section, sectionIndex) {
  let n = 0;
  return section.blocks
    .map((block) => {
      if (typeof block === "string") {
        n += 1;
        return `<p class="legal-clause"><span class="legal-num">${sectionIndex + 1}.${n}</span><span>${escapeHtml(block)}</span></p>`;
      }
      const list = block.list
        ? `<ul class="legal-list">${block.list.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
        : "";
      if (block.lead) return `<p class="legal-lead">${escapeHtml(block.lead)}</p>`;
      if (block.note) return `<p class="legal-lead legal-note">${escapeHtml(block.note)}</p>`;
      if (block.label) return `<p class="legal-label">${escapeHtml(block.label)}</p>${list}`;
      return list;
    })
    .join("");
}

function renderDocBody(doc) {
  return doc.sections
    .map(
      (section, index) => `
      <section class="legal-section">
        <h3><span class="legal-sec-num">${index + 1}</span>${escapeHtml(section.title)}</h3>
        ${renderBlocks(section, index)}
      </section>`
    )
    .join("");
}

// Окно чтения документа поверх любого экрана.
function renderLegalReader(docId) {
  const doc = DOCS[docId];
  if (!doc) return "";
  return `
    <div class="legal-overlay" data-legal-backdrop>
      <div class="legal-sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(doc.title)}">
        <header class="legal-head">
          <button class="legal-back" type="button" data-action="legal-close" aria-label="Назад">${icon("back", 20)}</button>
          <div>
            <p class="eyebrow">${escapeHtml(doc.kicker)}</p>
            <h2>${escapeHtml(doc.title)}</h2>
            <span class="legal-version">Версия ${LEGAL_VERSION}</span>
          </div>
        </header>
        <div class="legal-scroll" data-legal-scroll>${renderDocBody(doc)}</div>
        <footer class="legal-foot">
          <button class="primary-button full" type="button" data-action="legal-close">Понятно</button>
        </footer>
      </div>
    </div>`;
}

function docRows() {
  return ORDER.map((id) => {
    const doc = DOCS[id];
    return `

async function saveAvatar(file) {
  const image = await createImageBitmap(file);
  try {
    const size = Math.min(image.width, image.height);
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 256;
    const context = canvas.getContext("2d");
    context.fillStyle = "#f4f4ef";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, (image.width - size) / 2, (image.height - size) / 2, size, size, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.88);
  } finally {
    image.close();
  }
}

        <span class="bottom-nav-pill${state.screen === "create" ? " is-round" : ""}" aria-hidden="true"
          style="--tab-center:${(activeTab + 0.5) / mobileMenu.length};--tab-count:${mobileMenu.length}"></span>
        ${mobileMenu
          .map(
            (item) => `
          <button type="button" class="${state.screen === item.id ? "active" : ""}" data-nav="${item.id}" ${state.screen === item.id ? 'aria-current="page"' : ""}>

  const pill = root.querySelector(".bottom-nav-pill");
  if (pillStart && pill.offsetWidth && !reducedMotion.matches) {
    const { left, width, backgroundColor } = getComputedStyle(pill);

function go(screen) {

    state.dragX = 0;
    state.pointerStart = null;
    window.scrollTo(0, 0);
  }
  state.screen = screen;
  state.formError = "";
  if (window.location.hash.replace("#", "") !== screen) {
    window.location.hash = screen;

  render();
  if (screen === "stats") {
    loadStats();

function showToast(message) {
  state.toast = message;
  render();
  window.clearTimeout(state.toastTimer);
  state.toastTimer = window.setTimeout(() => {
    state.toast = "";
    const toast = root.querySelector(".toast");
    if (!toast || reducedMotion.matches) {
      toast?.remove();
      return;
    }
    const exit = toast.animate([
      { opacity: 1, transform: "translateY(0)" },
      { opacity: 0, transform: "translateY(5px)" },
    ], { duration: 150, easing: motionEase, fill: "forwards" });
    exit.finished.then(() => toast.remove(), () => {});
  }, 2200);
}

async function copyText(value) {

    showToast("Реквизиты скопированы");

  }

async function swipe(direction) {
  const card = root.querySelector("[data-card]");
  if (state.animating || !card || !state.cards.length || state.screen !== "feed") return;
  const cards = state.cards;
  const current = cards[state.index % cards.length];
  state.animating = true;
  state.pointerStart = null;
  card.classList.remove("dragging");
  card.classList.add("animating");
  const sign = direction === "left" ? -1 : 1;
  try {
    if (!reducedMotion.matches) {
      const animation = card.animate([
        { transform: getComputedStyle(card).transform, opacity: 1 },
        { transform: `translateX(${sign * (window.innerWidth + card.offsetWidth)}px) rotate(${sign * 16}deg)`, opacity: 0.4 },
      ], { duration: 230, easing: motionEase, fill: "forwards" });
      await animation.finished.catch(() => {});
    }
    if (cards !== state.cards) return;
    if (direction === "right" && state.screen === "feed") {
      try {
        const helped = await api.helpCard(current.id);
        if (cards === state.cards && state.screen === "feed") state.helped = helped;
      } catch (error) {
        showToast(error.message);
      }
    }
    if (cards === state.cards) state.index += 1;
  } finally {
    state.dragX = 0;
    state.animating = false;
    if (state.screen === "feed") {
      render();
      if (cards === state.cards) trackCurrentView();
    }
  }
}

function bindCardGestures() {
  const card = root.querySelector("[data-card]");
  if (!card) return;
  let dragFrame = 0;
  const applyDrag = () => {
    const rotate = Math.max(-12, Math.min(12, state.dragX / 28));
    card.style.transform = `translateX(${state.dragX}px) rotate(${rotate}deg)`;
    card.classList.toggle("dragging", state.pointerStart !== null);
    let stamp = card.querySelector(".swipe-stamp");
    const label = state.dragX > 40 ? "ПОМОЧЬ" : state.dragX < -40 ? "ДАЛЬШЕ" : "";
    if (label) {
      if (!stamp) {
        stamp = document.createElement("div");
        card.prepend(stamp);
      }
      stamp.className = `swipe-stamp ${state.dragX > 0 ? "help" : "skip"}`;
      stamp.textContent = label;
    } else if (stamp) {
      stamp.remove();
    }
  };
  card.addEventListener("pointerdown", (event) => {
    if (!event.isPrimary || event.button !== 0 || state.animating || event.target.closest("button, dialog")) return;
    card.setPointerCapture(event.pointerId);
    state.pointerStart = event.clientX;
    applyDrag();
  });
  card.addEventListener("pointermove", (event) => {
    if (!event.isPrimary || state.pointerStart === null || state.animating) return;
    state.dragX = event.clientX - state.pointerStart;
    if (!dragFrame) dragFrame = window.requestAnimationFrame(() => {
      dragFrame = 0;
      if (card.isConnected) applyDrag();
    });
  });
  const end = (event) => {
    if (!event.isPrimary || state.pointerStart === null) return;
    window.cancelAnimationFrame(dragFrame);
    dragFrame = 0;
    state.pointerStart = null;
    if (event.type === "pointerup" && Math.abs(state.dragX) > 95) {
      swipe(state.dragX > 0 ? "right" : "left");
    } else {
      state.dragX = 0;
      applyDrag();
    }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

async function trackCurrentView() {
  if (!state.cards.length) return;
  const current = state.cards[state.index % state.cards.length];
  try {
    await api.viewCard(current.id);
  } catch {
    /* viewing is best-effort */
  }
}

function paintCreatePreview() {
  const amount = Number(String(state.form.amount || "").replace(/\D/g, "")) || 0;
  const purpose = state.form.purpose || "";
  const category = state.form.category;
  const previewCard = root.querySelector("[data-preview-card]");
  const amountNode = root.querySelector("[data-preview-amount]");
  const purposeNode = root.querySelector("[data-preview-purpose]");
  const descriptionNode = root.querySelector("[data-preview-card] [data-card-description]");
  const descriptionButton = root.querySelector("[data-preview-card] [data-open-description]");
  if (descriptionNode && descriptionButton) {
    descriptionNode.textContent = state.form.description;
    descriptionButton.hidden = !state.form.description.trim();
  }
  const categoryNode = root.querySelector("[data-preview-category]");
  const charCount = root.querySelector("[data-char-count]");
  const submit = root.querySelector("[data-submit-create]");
  if (previewCard) previewCard.style.setProperty("--card-color", cardColor(category, state.colors));
  if (categoryNode) categoryNode.textContent = category;
  if (amountNode) {
    amountNode.textContent = amount ? money(amount) : "0 ₽";
    amountNode.classList.toggle("placeholder-text", !amount);
  }
  if (purposeNode) {
    purposeNode.textContent = purpose || "Здесь появится описание вашей цели";
    purposeNode.classList.toggle("placeholder-text", !purpose);
  }
  if (charCount) charCount.textContent = `${purpose.length} / 160`;
  if (submit) submit.disabled = !(amount > 0 && purpose.trim().length >= 10) || state.submitting;
}

root.addEventListener("click", async (event) => {
  const descriptionButton = event.target.closest("[data-open-description]");
  if (descriptionButton) {
    descriptionButton.nextElementSibling.showModal();
    return;
  }

  const closeDescription = event.target.closest("[data-close-description]");
  if (closeDescription) {
    closeDescription.closest("dialog").close();
    return;
  }

  const legalOpen = event.target.closest("[data-legal]");
  if (legalOpen) {
    setLegalDoc(legalOpen.dataset.legal);
    return;
  }
  if (event.target.closest("[data-action='legal-close']") || event.target.matches("[data-legal-backdrop]")) {
    setLegalDoc(null);
    return;
  }
  if (event.target.closest("[data-action='gate-continue']")) {
    await acceptGate();
    return;
  }

  const nav = event.target.closest("[data-nav]");
  if (nav) {
    go(nav.dataset.nav);
    return;
  }

  const periodButton = event.target.closest("button[data-period]");
  if (periodButton) {
    if (state.period === periodButton.dataset.period) return;
    const section = periodButton.closest(".mobile-header") ? ".mobile-header" : ".stats-screen";
    state.period = periodButton.dataset.period;
    await loadStats();
    if (document.activeElement === document.body) {
      root.querySelector(`${section} button[aria-pressed="true"]`)?.focus({ preventScroll: true });
    }
    return;
  }

  const swipeBtn = event.target.closest("[data-swipe]");
  if (swipeBtn) {
    swipe(swipeBtn.dataset.swipe);
    return;
  }

  if (event.target.closest("[data-close-modal]")) {
    if (event.target.closest("[data-modal-card]") && !event.target.closest("[data-close-modal]")) {
      return;
    }
    if (event.target.classList.contains("requisites-modal")) return;
    state.helped = null;
    render();
    return;
  }

  const copyBtn = event.target.closest("[data-copy]");
  if (copyBtn) {
    copyText(copyBtn.dataset.copy);
    return;
  }

  const action = event.target.closest("[data-action]");
  if (action?.dataset.action === "choose-avatar") {
    root.querySelector("[data-avatar-file]")?.click();
    return;
  }
  const profileSection = event.target.closest("[data-profile-section]")?.dataset.profileSection;
  if (profileSection) {
    const previousRows = new Map();
    if (!reducedMotion.matches) {
      for (const row of root.querySelectorAll("[data-profile-section]")) {
        previousRows.set(row.dataset.profileSection, row.getBoundingClientRect().top);
      }
    }
    state.profileSection = state.profileSection === profileSection ? "" : profileSection;
    state.formError = "";
    state.deleting = false;
    state.deleteError = "";
    render();
    const button = root.querySelector(`[data-profile-section="${profileSection}"]`);
    if (!reducedMotion.matches && state.profileSection) {
      button.nextElementSibling.animate([
        { opacity: 0, transform: "translateY(-5px)" },
        { opacity: 1, transform: "translateY(0)" },
      ], { duration: 200, easing: motionEase });
    }
    for (const row of root.querySelectorAll("[data-profile-section]")) {
      if (!previousRows.has(row.dataset.profileSection)) continue;
      const offset = previousRows.get(row.dataset.profileSection) - row.getBoundingClientRect().top;
      if (Math.abs(offset) > 1) {
        row.animate([{ transform: `translateY(${offset}px)` }, { transform: "translateY(0)" }], {
          duration: 200, easing: motionEase,
        });
      }
    }
    button?.focus({ preventScroll: true });
    return;
  }
  if (action?.dataset.action === "reload") await loadFeed();
  if (action?.dataset.action === "toggle-auth") {
    state.authMode = state.authMode === "login" ? "register" : "login";
    state.authError = "";
    renderAuth();
  }
  if (action?.dataset.action === "delete-start") {
    state.deleting = true;
    state.deleteError = "";
    render();
  }
  if (action?.dataset.action === "delete-cancel") {
    state.deleting = false;
    state.deleteError = "";
    render();
  }
  if (action?.dataset.action === "export-data") {
    try {
      const data = await api.exportData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "payder-data.json";
      link.click();
      URL.revokeObjectURL(url);
    } catch (error) {
      showToast(error.message);
    }
  }
  if (action?.dataset.action === "logout") {
    await api.logout();
    state.authenticated = false;
    state.profile = null;
    state.cards = [];
    state.authMode = "login";
    showEntry();
  }
});

root.addEventListener("mousedown", (event) => {
  if (event.target.classList.contains("modal-backdrop")) {
    state.helped = null;
    render();
  }
});

root.addEventListener("change", async (event) => {
  if (event.target.matches("[data-theme-picker]")) {
    currentTheme = event.target.value;
    applyTheme();
    try {
      window.localStorage.setItem(THEME_KEY, currentTheme);
    } catch {
      showToast("Тема изменена для этой вкладки");
    }
    return;
  }
  if (event.target.matches("[data-avatar-file]")) {
    const input = event.target;
    const file = input.files[0];
    if (!file) return;
    input.disabled = true;
    try {
      avatar = await saveAvatar(file);
      try {
        window.localStorage.setItem(AVATAR_KEY, avatar);
      } catch {
        showToast("Фото изменено для этой вкладки");
        return;
      }
      render();
    } catch {
      showToast("Не удалось открыть фото. Попробуйте JPG, PNG или WebP.");
    } finally {
      input.disabled = false;
    }
    return;
  }
  if (event.target.matches("[data-gate]")) {
    state.gate[event.target.dataset.gate] = event.target.checked;
    const ready = state.gate.terms && state.gate.privacy;
    const button = root.querySelector("[data-action='gate-continue']");
    const hint = root.querySelector("[data-gate-hint]");
    if (button) button.disabled = !ready;
    if (hint) hint.hidden = ready;
    return;
  }
  if (event.target.closest("[data-form='create']") && event.target.name === "category") {
    state.form.category = event.target.value;
    paintCreatePreview();
  }
});

root.addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.target;
  if (form.dataset.form === "auth") {
    const payload = Object.fromEntries(new FormData(form).entries());
    try {
      state.authError = "";
      state.authNote = "";
      if (state.authMode === "register") await api.register({ ...payload, consent_version: state.consent?.version });
      else await api.login(payload);
      state.profile = await api.profile();
      const menu = await api.menu();
      state.menu = menu.items?.length ? menu.items : DEFAULT_MENU;
      state.banks = menu.banks || state.banks;
      state.categories = menu.categories || state.categories;
      state.colors = menu.colors || {};
      state.authenticated = true;
      state.form.category = state.categories[0];
      if (!state.profile.legal_accepted) {
        state.gate = { terms: false, privacy: false };
        state.gateOpen = true;
        render();
        return;
      }
      await loadFeed();
    } catch (error) { state.authError = error.message; renderAuth(); }
    return;
  }
  if (form.dataset.form === "delete") {
    const password = new FormData(form).get("password");
    try {
      await api.deleteAccount(password);
      state.authenticated = false;
      state.profile = null;
      state.cards = [];
      state.stats = null;
      state.helped = null;
      state.deleting = false;
      state.deleteError = "";
      state.authMode = "login";
      state.authError = "";
      state.authNote = "Аккаунт удалён вместе со всеми данными.";
      showEntry();
    } catch (error) {
      state.deleteError = error.message;
      render();
    }
    return;
  }
  if (form.dataset.form === "profile") {
    const payload = Object.fromEntries(new FormData(form).entries());
    try {
      state.submitting = true;
      state.profile = await api.saveProfile(payload);
      state.formError = "";
      showToast("Профиль сохранён");
    } catch (error) {
      state.formError = error.message;
      render();
    } finally {
      state.submitting = false;
    }
  }
  if (form.dataset.form === "create") {
    const data = Object.fromEntries(new FormData(form).entries());
    const amount = Number(String(data.amount).replace(/\D/g, "")) || 0;
    try {
      state.submitting = true;
      render();
      await api.createCard({
        amount,
        purpose: data.purpose,
        description: data.description.trim(),
        category: data.category,
      });
      state.form = { amount: "", purpose: "", description: "", category: data.category };
      state.formError = "";
      await loadFeed();
      state.profile = await api.profile();
      state.submitting = false;
      go("feed");
      showToast("Карточка опубликована");
    } catch (error) {
      state.submitting = false;
      state.formError = error.message;
      render();
    }
  }
});

root.addEventListener("input", (event) => {
  const form = event.target.closest("[data-form='create']");
  if (!form) return;
  const data = Object.fromEntries(new FormData(form).entries());
  state.form = {
    amount: data.amount,
    purpose: String(data.purpose || "").slice(0, 160),
    description: String(data.description || "").slice(0, 1000),
    category: data.category,
  };
  if (event.target.name === "purpose" && event.target.value.length > 160) {
    event.target.value = state.form.purpose;
  }
  paintCreatePreview();
});

window.addEventListener("hashchange", () => {
  const next = screenFromHash();
  if (next !== state.screen) go(next);
});

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && state.legalDoc) {
    setLegalDoc(null);
    return;
  }
  if (state.gateOpen || state.legalDoc || root.querySelector(".card-description[open]")) return;
  if (state.screen !== "feed" || state.helped) return;
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (event.key === "ArrowLeft") swipe("left");
  if (event.key === "ArrowRight") swipe("right");
});

async function loadFeed() {
  state.loading = true;
  state.error = "";
  render();
  try {
    state.cards = await api.cards();
    state.index = 0;
  } catch (error) {
    state.error = error.message;
  } finally {
    state.loading = false;
    render();
    trackCurrentView();
  }
}

async function loadStats() {
  const period = state.period;
  state.statsLoading = true;
  if (!state.stats && state.screen === "stats") render();
  try {
    const stats = await api.stats(period);
    if (state.period !== period) return;
    state.stats = stats;
    state.statsPeriod = period;
    state.error = "";
  } catch (error) {
    if (state.period !== period) return;
    if (!state.stats) state.error = error.message;
    else showToast(error.message);
  } finally {
    if (state.period === period) {
      state.statsLoading = false;
      if (state.screen === "stats") render();
    }
  }
}

async function boot() {
  try {
    const menu = await api.menu();
    state.menu = menu.items?.length ? menu.items : DEFAULT_MENU;
    state.banks = menu.banks || state.banks;
    state.categories = menu.categories || state.categories;
    state.colors = menu.colors || {};
    state.profile = await api.profile();
    state.authenticated = true;
    state.form.category = state.categories[0];
    if (!state.profile.legal_accepted) {
      state.loading = false;
      state.gateOpen = true;
      render();
      return;
    }
    await loadFeed();
    if (state.screen === "stats") await loadStats();
  } catch {
    state.loading = false;
    state.authenticated = false;
    showEntry();
  }
}

boot();
window.PayderPreview={show:(screen)=>go(screen),reset:()=>{cardsData=demoCards.map(c=>({...c}));location.hash="feed";loadFeed();}};

  </script>
